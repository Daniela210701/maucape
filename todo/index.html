<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas - To-Do App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-tasks"></i> Mi Lista de Tareas</h1>
            <p>Organiza tu día y sé más productivo</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Escribe una nueva tarea..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="priority-selector">
                    <label for="prioritySelect">Prioridad:</label>
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completadas:</span>
                    <span class="stat-value completed" id="completedCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Pendientes:</span>
                    <span class="stat-value pending" id="pendingCount">0</span>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i> Todas
                </button>
                <button class="filter-btn" data-filter="pending">
                    <i class="fas fa-hourglass-start"></i> Pendientes
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> Completadas
                </button>
                <button class="filter-btn" data-filter="high">
                    <i class="fas fa-fire"></i> Alta Prioridad
                </button>
            </div>

            <!-- Todo List -->
            <div class="todo-list-wrapper">
                <ul class="todo-list" id="todoList">
                    <!-- Tareas se añadirán aquí dinámicamente -->
                </ul>
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-inbox"></i>
                    <p>No hay tareas aún</p>
                    <small>Crea una nueva tarea para comenzar</small>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="action-btn clear-btn">
                    <i class="fas fa-trash"></i> Limpiar Completadas
                </button>
                <button id="clearAllBtn" class="action-btn delete-btn">
                    <i class="fas fa-broom"></i> Limpiar Todo
                </button>
            </div>
        </main>
    </div>

    <!-- Modal de Confirmación -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2>¿Estás seguro?</h2>
            <p id="modalMessage">Esta acción no se puede deshacer.</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" id="cancelBtn">Cancelar</button>
                <button class="modal-btn confirm-btn" id="confirmBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
